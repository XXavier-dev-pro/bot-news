name: News Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Restore database berita
        uses: actions/cache/restore@v4
        with:
          path: news.db
          key: newsdb-${{ github.run_id }}
          restore-keys: newsdb-

      - name: Jalankan news bot
        run: python news_bot.py
        env:
          WEBHOOK_NEWS: ${{ secrets.WEBHOOK_NEWS }}

      - name: Simpan database berita
        if: always()
        uses: actions/cache/save@v4
        with:
          path: news.db
          key: newsdb-${{ github.run_id }}
